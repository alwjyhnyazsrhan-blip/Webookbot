services:
  - type: web
    name: webook-auto-booker
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "gunicorn app:app --worker-class sync --workers 1 --timeout 300"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
